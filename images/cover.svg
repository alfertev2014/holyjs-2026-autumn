<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Базовый фон -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="80%">
      <stop offset="0%"  stop-color="#131624"/>
      <stop offset="60%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>

    <!-- Радиальные градиенты для свечений (плавное затухание) -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7dc9e8" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#7dc9e8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7dc9e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bb89dc" stop-opacity="0.32"/>
      <stop offset="55%"  stop-color="#bb89dc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bb89dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f78c6c" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#f78c6c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f78c6c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c3e88d" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#c3e88d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c3e88d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffcb6b" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ffcb6b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffcb6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#82aaff" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#82aaff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#82aaff" stop-opacity="0"/>
    </radialGradient>

    <!-- Сетка: мелкая -->
    <pattern id="gridSmall" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#babed8" stroke-width="3" opacity="0.08"/>
    </pattern>
    <!-- Сетка: крупная -->
    <pattern id="gridLarge" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M 240 0 L 0 0 0 240" fill="none" stroke="#babed8" stroke-width="5" opacity="0.14"/>
    </pattern>

    <!-- Виньетка для глубины -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Лёгкое размытие для свечений -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Базовый фон -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- ============ СЕТКА ============ -->
  <rect width="1920" height="1080" fill="url(#gridSmall)"/>
  <rect width="1920" height="1080" fill="url(#gridLarge)"/>

  <!-- ============ ВИНЬЕТКА ============ -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>